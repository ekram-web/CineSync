<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cinesyncRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A2A"/>
      <stop offset="100%" stop-color="#B20710"/>
    </linearGradient>
    <linearGradient id="syncGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D5A"/>
      <stop offset="100%" stop-color="#E50914"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Cinema Background -->
  <rect width="100" height="100" rx="22" fill="#0E0E0E"/>
  <rect x="1" y="1" width="98" height="98" rx="21" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- CineSync "C" Arc Ribbon with Cinema Sync Play Notch -->
  <g filter="url(#shadow)">
    <!-- Main Sweeping Ribbon -->
    <path d="M 68 28
             C 60 20, 36 20, 28 32
             C 18 46, 18 64, 28 78
             C 38 90, 62 90, 72 82
             C 74 80, 75 78, 72 75
             C 69 72, 67 74, 64 76
             C 56 82, 38 82, 32 72
             C 24 60, 24 48, 32 38
             C 38 30, 54 28, 62 34
             C 65 36, 68 35, 68 28 Z"
          fill="url(#cinesyncRed)"/>

    <!-- Central Sync Triangle (Play & Sync) -->
    <polygon points="46,38 72,55 46,72" fill="url(#syncGlow)"/>

    <!-- Live Sync Accent Dot -->
    <circle cx="76" cy="30" r="5" fill="#46D369"/>
  </g>
</svg>
